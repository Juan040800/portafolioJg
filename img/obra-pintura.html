<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pintura — Juan García</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --carbon:#1A1A1A;
    --carbon-2:#141310;
    --off-white:#EDEAE4;
    --stone:#8C8880;
    --sand:#C9B79C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--carbon);
    color:var(--off-white);
    font-family:'Inter',sans-serif;
    font-weight:300;
  }

  /* nav idéntico al del index, para consistencia de marca */
  nav{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);
    z-index:50;display:flex;gap:6px;
    background:rgba(26,26,26,0.7);backdrop-filter:blur(10px);
    border:1px solid rgba(237,234,228,0.12);
    border-radius:999px;padding:6px;
  }
  nav a{
    color:var(--stone);text-decoration:none;
    font-family:'Unbounded',sans-serif;font-size:0.7rem;
    letter-spacing:0.08em;text-transform:uppercase;
    padding:10px 18px;border-radius:999px;transition:color .3s ease, background .3s ease;
  }
  nav a:hover, nav a.active{color:var(--carbon);background:var(--sand);}

  header.obra-head{
    padding:min(18vw,180px) 6vw 60px;
    max-width:900px;
  }
  .obra-eyebrow{
    font-family:'Unbounded',sans-serif;font-size:0.7rem;
    letter-spacing:0.2em;text-transform:uppercase;color:var(--sand);
    display:block;margin-bottom:18px;
  }
  header.obra-head h1{
    font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:clamp(2.6rem,7vw,5rem);line-height:1;
  }
  header.obra-head p{
    margin-top:20px;color:var(--stone);line-height:1.7;max-width:56ch;
  }

  /* grid de la galería — cada imagen es una "carpeta" abierta */
  .gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    background:rgba(237,234,228,0.08);
    padding-bottom:2px;
  }
  .gallery figure{
    position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--carbon-2);
    cursor:zoom-in;
  }
  .gallery img{
    width:100%;height:100%;object-fit:cover;
    display:block;transform:scale(1.02);
    transition:transform .7s cubic-bezier(.2,.7,.2,1), filter .7s ease;
    filter:saturate(0.9);
  }
  .gallery figure:hover img{transform:scale(1.08);filter:saturate(1.05);}
  .gallery figcaption{
    position:absolute;left:0;right:0;bottom:0;
    padding:16px;font-size:0.75rem;color:var(--stone);
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    opacity:0;transition:opacity .35s ease;
  }
  .gallery figure:hover figcaption{opacity:1;}

  @media (max-width:820px){
    .gallery{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .gallery{grid-template-columns:1fr;}
  }

  /* lightbox simple, sin dependencias */
  #lightbox{
    position:fixed;inset:0;background:rgba(10,9,7,0.94);
    display:none;align-items:center;justify-content:center;z-index:100;
    padding:5vw;
  }
  #lightbox.open{display:flex;}
  #lightbox img{max-width:100%;max-height:88vh;border-radius:2px;}
  #lightbox .close{
    position:absolute;top:24px;right:6vw;
    color:var(--off-white);font-family:'Unbounded',sans-serif;
    font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;
    cursor:pointer;border:1px solid rgba(237,234,228,0.3);
    padding:10px 16px;border-radius:999px;
  }

  footer{
    padding:40px 6vw;text-align:center;color:var(--stone);
    font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;
  }
</style>
</head>
<body>

<nav>
  <a href="índice.html">Perfil</a>
  <a href="índice.html#obra" class="active">Obra</a>
  <a href="índice.html#contacto">Contacto</a>
</nav>

<header class="obra-head">
  <span class="obra-eyebrow">02 · Pintura</span>
  <h1>18 obras</h1>
  <p>Óleo sobre lienzo, capas y veladuras de color terroso. Selección completa de la serie.</p>
</header>

<!--
  GALERÍA
  Cada <figure> es una obra de la carpeta imagen/pintura/.
  Para agregar una imagen nueva: copiá el bloque <figure>...</figure>,
  cambiá el src y (si querés) el texto del figcaption.
-->
<section class="gallery" id="galeria">
  <figure onclick="abrir(this)">
    <img src="imagen/pintura/01.jpg" alt="Pintura 01">
    <figcaption>Óleo sobre lienzo</figcaption>
  </figure>
  <figure onclick="abrir(this)">
    <img src="imagen/pintura/02.jpg" alt="Pintura 02">
    <figcaption>Óleo sobre lienzo</figcaption>
  </figure>
  <figure onclick="abrir(this)">
    <img src="imagen/pintura/03.jpg" alt="Pintura 03">
    <figcaption>Óleo sobre lienzo</figcaption>
  </figure>
  <!-- agregá más <figure> acá, una por obra -->
</section>

<footer>© 2026 Juan García — Pintura</footer>

<div id="lightbox" onclick="cerrar(event)">
  <span class="close" onclick="cerrar(event)">Cerrar ✕</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  function abrir(fig){
    const src = fig.querySelector('img').src;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function cerrar(e){
    document.getElementById('lightbox').classList.remove('open');
  }
</script>

</body>
</html>
