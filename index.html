
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Portafolio artístico de Juan García — pintura, fotografía y escultura."
  >

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Juan García — Artista · Pintura · Fotografía · Escultura">
  <meta property="og:description" content="Portafolio artístico de Juan García — pintura, fotografía y escultura.">
  <meta property="og:image" content="imagen/perfil.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#0b1820">
  <link rel="icon" href="data:,">

  <title>Juan García — Artista · Pintura · Fotografía · Escultura</title>

  <!-- =========================
       GOOGLE FONTS
  ========================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =====================================================
       VARIABLES
    ====================================================== */

    :root {
      --background: #0b1820;
      --background-deep: #071117;

      --foreground: #ffffff;
      --off-white: #eeeae3;

      --muted: #a7a9ad;
      --stone: #85888b;

      --sand: #c9b79c;

      --border: rgba(255, 255, 255, 0.14);

      --glass: rgba(255, 255, 255, 0.035);

      --font-display: "Instrument Serif", serif;
      --font-body: "Inter", sans-serif;
    }


    /* =====================================================
       RESET
    ====================================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--background-deep);
      color: var(--foreground);
      font-family: var(--font-body);
      font-weight: 300;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    ::selection {
      background: var(--sand);
      color: #111;
    }

    /* Foco visible accesible en toda la página */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--sand);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .skip-link {
      position: absolute;
      top: -60px;
      left: 16px;
      z-index: 200;
      padding: 10px 18px;
      background: var(--off-white);
      color: #111;
      border-radius: 999px;
      font-size: 0.8rem;
      text-decoration: none;
      transition: top 0.25s ease;
    }

    .skip-link:focus {
      top: 16px;
    }


    /* =====================================================
       TYPOGRAPHY
    ====================================================== */

    .display {
      font-family: var(--font-display);
      font-weight: 400;
    }

    .eyebrow {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }


    /* =====================================================
       LIQUID GLASS
    ====================================================== */

    .liquid-glass {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.025);
      background-blend-mode: luminosity;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      border: 1px solid rgba(255, 255, 255, 0.10);

      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.10),
        0 12px 40px rgba(0, 0, 0, 0.15);

      transition: background 0.35s ease, backdrop-filter 0.35s ease;
    }

    .liquid-glass::before {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: inherit;

      padding: 1px;

      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.38) 0%,
        rgba(255,255,255,0.12) 20%,
        rgba(255,255,255,0) 45%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.10) 80%,
        rgba(255,255,255,0.28) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;

      pointer-events: none;
    }


    /* =====================================================
       NAVIGATION
    ====================================================== */

    .site-nav {
      position: fixed;

      top: 22px;
      left: 50%;

      transform: translateX(-50%);

      width: min(92%, 1180px);

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 12px 10px 22px;

      border-radius: 28px;
    }

    .logo {
      position: relative;
      z-index: 2;

      text-decoration: none;

      font-family: var(--font-display);
      font-size: 1.75rem;

      line-height: 1;

      letter-spacing: -0.03em;

      white-space: nowrap;
    }

    .logo span {
      color: var(--sand);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;

      list-style: none;
    }

    .nav-links a {
      position: relative;

      display: block;

      padding: 9px 14px;

      text-decoration: none;

      color: var(--muted);

      font-size: 0.72rem;
      font-weight: 400;

      transition:
        color 0.3s ease,
        background 0.3s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--foreground);
    }

    .nav-links a.active::after {
      content: "";

      position: absolute;

      bottom: 2px;
      left: 50%;

      width: 4px;
      height: 4px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: var(--sand);
    }

    .nav-cta {
      position: relative;
      z-index: 2;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 40px;

      padding: 0 18px;

      border-radius: 999px;

      text-decoration: none;

      color: var(--foreground);

      font-size: 0.7rem;
      font-weight: 500;

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .nav-cta:hover {
      transform: scale(1.03);
      background: rgba(255,255,255,0.08);
    }


    /* =====================================================
       MOBILE MENU
    ====================================================== */

    .menu-button {
      display: none;

      position: relative;
      z-index: 3;

      width: 42px;
      height: 42px;

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 50%;

      background: rgba(255,255,255,0.03);

      color: white;
    }

    .menu-button span,
    .menu-button span::before,
    .menu-button span::after {
      content: "";

      position: absolute;

      left: 50%;

      width: 16px;
      height: 1px;

      background: white;

      transform: translateX(-50%);

      transition: transform 0.3s ease, opacity 0.3s ease, top 0.3s ease;
    }

    .menu-button span {
      top: 20px;
    }

    .menu-button span::before {
      top: -6px;
    }

    .menu-button span::after {
      top: 6px;
    }

    /* Estado abierto: la línea central se oculta y las otras forman una X */
    .site-nav.menu-open .menu-button span {
      background: transparent;
    }

    .site-nav.menu-open .menu-button span::before {
      top: 0;
      transform: translateX(-50%) rotate(45deg);
    }

    .site-nav.menu-open .menu-button span::after {
      top: 0;
      transform: translateX(-50%) rotate(-45deg);
    }

    /* Panel desplegable móvil (oculto en escritorio) */
    .mobile-panel {
      display: none;
    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero {
      position: relative;

      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      isolation: isolate;

      background: var(--background);
    }

    .hero-image {
      position: absolute;

      inset: 0;

      z-index: -3;

      background:
        url("imagen/perfil.jpg")
        center center / cover
        no-repeat;

      transform: scale(1.02);

      animation: hero-breathe 14s ease-in-out infinite alternate;
    }

    @keyframes hero-breathe {
      from {
        transform: scale(1.02);
      }

      to {
        transform: scale(1.06);
      }
    }


    /* =====================================================
       CINEMATIC DARKNESS
    ====================================================== */

    .hero-overlay {
      position: absolute;

      inset: 0;

      z-index: -2;

      background:
        linear-gradient(
          180deg,
          rgba(5, 12, 16, 0.50) 0%,
          rgba(5, 12, 16, 0.12) 35%,
          rgba(5, 12, 16, 0.32) 60%,
          rgba(5, 12, 16, 0.90) 100%
        );

      pointer-events: none;
    }

    .hero-vignette {
      position: absolute;

      inset: 0;

      z-index: -1;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.38),
          transparent 40%,
          rgba(0,0,0,0.18)
        );

      pointer-events: none;
    }


    /* =====================================================
       HERO CONTENT
    ====================================================== */

    .hero-content {
      width: min(1180px, 92%);

      padding:
        150px
        0
        120px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 11px;

      color: rgba(255,255,255,0.72);

      margin-bottom: 28px;
    }

    .hero-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--sand);

      box-shadow:
        0 0 15px rgba(201,183,156,0.7);
    }

    .hero-title {
      max-width: 1050px;

      font-family: var(--font-display);

      font-size: clamp(
        4rem,
        10vw,
        9.5rem
      );

      font-weight: 400;

      line-height: 0.82;

      letter-spacing: -0.045em;

      color: var(--foreground);
    }

    .hero-title .muted {
      color: rgba(255,255,255,0.60);
      font-style: italic;
    }

    .hero-description {
      max-width: 640px;

      margin-top: 38px;

      color: rgba(255,255,255,0.70);

      font-size: clamp(
        0.92rem,
        1.5vw,
        1.08rem
      );

      line-height: 1.75;
    }

    .hero-disciplines {
      margin-top: 26px;

      color: var(--sand);

      font-size: 0.68rem;

      font-weight: 500;

      letter-spacing: 0.22em;

      text-transform: uppercase;
    }


    /* =====================================================
       HERO BUTTON
    ====================================================== */

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;

      margin-top: 42px;
    }

    .primary-button {
      position: relative;
      z-index: 1;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 15px 30px;

      border-radius: 999px;

      text-decoration: none;

      color: #111;

      background: var(--off-white);

      font-size: 0.75rem;
      font-weight: 500;

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .primary-button:hover {
      transform: scale(1.03);

      background: white;
    }

    .secondary-button {
      display: inline-flex;
      align-items: center;

      padding: 15px 24px;

      border-radius: 999px;

      text-decoration: none;

      color: rgba(255,255,255,0.82);

      font-size: 0.75rem;

      border: 1px solid rgba(255,255,255,0.16);

      transition:
        color 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease;
    }

    .secondary-button:hover {
      color: white;

      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.3);
    }


    /* =====================================================
       SCROLL INDICATOR
    ====================================================== */

    .scroll-indicator {
      position: absolute;

      bottom: 30px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 12px;

      color: rgba(255,255,255,0.55);

      font-size: 0.6rem;

      letter-spacing: 0.2em;

      text-transform: uppercase;
    }

    .scroll-line {
      position: relative;

      width: 42px;
      height: 1px;

      overflow: hidden;

      background: rgba(255,255,255,0.25);
    }

    .scroll-line::after {
      content: "";

      position: absolute;

      left: -100%;

      top: 0;

      width: 100%;
      height: 100%;

      background: white;

      animation: scroll-line 2.5s ease-in-out infinite;
    }

    @keyframes scroll-line {
      0% {
        left: -100%;
      }

      50% {
        left: 100%;
      }

      100% {
        left: 100%;
      }
    }


    /* =====================================================
       GENERAL SECTIONS
    ====================================================== */

    section {
      position: relative;

      padding:
        clamp(90px, 12vw, 160px)
        6vw;
    }

    .section-container {
      width: min(1180px, 100%);

      margin: 0 auto;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      gap: 30px;

      margin-bottom: 70px;

      padding-bottom: 22px;

      border-bottom:
        1px solid
        rgba(255,255,255,0.10);
    }

    .section-label {
      color: var(--sand);

      font-size: 0.65rem;

      font-weight: 500;

      letter-spacing: 0.22em;

      text-transform: uppercase;
    }

    .section-title {
      margin-top: 12px;

      font-family: var(--font-display);

      font-size: clamp(
        2.8rem,
        6vw,
        5.5rem
      );

      line-height: 0.9;

      font-weight: 400;

      letter-spacing: -0.035em;
    }

    .section-number {
      color: var(--stone);

      font-size: 0.65rem;

      letter-spacing: 0.12em;
    }


    /* =====================================================
       ABOUT
    ====================================================== */

    .about-section {
      background: var(--background-deep);
    }

    .about-grid {
      display: grid;

      grid-template-columns:
        minmax(280px, 0.85fr)
        minmax(320px, 1.15fr);

      gap: clamp(50px, 9vw, 120px);

      align-items: center;
    }

    .about-image {
      position: relative;

      aspect-ratio: 3 / 4;

      overflow: hidden;

      background: #111;

      border-radius: 4px;
    }

    .about-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center;

      filter: saturate(0.85);

      transition:
        transform 0.8s ease,
        filter 0.8s ease;
    }

    .about-image:hover img {
      transform: scale(1.04);

      filter: saturate(1);
    }

    .about-image::after {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          transparent 55%,
          rgba(0,0,0,0.45)
        );
    }

    .about-content {
      max-width: 620px;
    }

    .about-heading {
      font-family: var(--font-display);

      font-size: clamp(
        2.5rem,
        4.5vw,
        4.4rem
      );

      font-weight: 400;

      line-height: 0.95;

      letter-spacing: -0.03em;

      margin-bottom: 28px;
    }

    .about-text {
      color: var(--muted);

      font-size: 0.96rem;

      line-height: 1.85;

      margin-bottom: 34px;
    }

    .discipline-list {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .discipline-list span {
      padding: 9px 15px;

      border:
        1px solid
        rgba(255,255,255,0.12);

      border-radius: 999px;

      color: rgba(255,255,255,0.78);

      font-size: 0.7rem;
    }


    /* =====================================================
       WORK
    ====================================================== */

    .work-section {
      background: #0a151c;
    }

    .work-intro {
      max-width: 620px;

      color: var(--muted);

      line-height: 1.75;

      margin-bottom: 55px;
    }

    .work-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 2px;

      background:
        rgba(255,255,255,0.08);
    }

    .work-card {
      position: relative;

      min-height: 600px;

      overflow: hidden;

      background: #111;

      text-decoration: none;

      display: flex;
      align-items: flex-end;

      padding: 30px;

      isolation: isolate;
    }

    .work-image {
      position: absolute;

      inset: 0;

      z-index: -2;

      background-size: cover;

      background-position: center;

      transition:
        transform 0.8s cubic-bezier(.2,.7,.2,1),
        filter 0.8s ease;
    }

    .work-card:nth-child(1) .work-image {
      background-image:
        url("imagen/pintura-01.jpg");
    }

    .work-card:nth-child(2) .work-image {
      background-image:
        url("imagen/fotografia-01.jpg");
    }

    .work-card:nth-child(3) .work-image {
      background-image:
        url("imagen/escultura-01.jpg");
    }

    .work-card:hover .work-image,
    .work-card:focus-visible .work-image {
      transform: scale(1.07);

      filter: saturate(1.08);
    }

    .work-overlay {
      position: absolute;

      inset: 0;

      z-index: -1;

      background:
        linear-gradient(
          180deg,
          transparent 25%,
          rgba(0,0,0,0.82) 100%
        );
    }

    .work-content {
      width: 100%;
    }

    .work-number {
      display: block;

      margin-bottom: 12px;

      color: var(--sand);

      font-size: 0.65rem;

      letter-spacing: 0.18em;

      font-weight: 500;
    }

    .work-title {
      font-family: var(--font-display);

      font-size: clamp(
        2.2rem,
        4vw,
        3.8rem
      );

      font-weight: 400;

      line-height: 0.9;
    }

    .work-description {
      margin-top: 12px;

      max-width: 240px;

      color: rgba(255,255,255,0.65);

      font-size: 0.75rem;

      line-height: 1.6;
    }

    .work-arrow {
      position: absolute;

      top: 24px;
      right: 24px;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,0.25);

      border-radius: 50%;

      color: white;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease;
    }

    .work-card:hover .work-arrow,
    .work-card:focus-visible .work-arrow {
      background: var(--off-white);

      color: #111;

      transform: rotate(45deg);
    }


    /* =====================================================
       FEATURED WORK
    ====================================================== */

    .featured-section {
      background: var(--background-deep);
    }

    .featured-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1.35fr)
        minmax(300px, 0.65fr);

      gap: clamp(40px, 8vw, 100px);

      align-items: center;
    }

    .featured-image
